<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Breakthrough Discovery{% endblock %}</title>
  <style>
    :root {
      --bg: #0b0c10; --panel: #14161c; --border: #262a33;
      --text: #e7e9ee; --muted: #9aa0ac; --accent: #6ee7b7; --warn: #f59e0b; --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      padding: 20px 32px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    header a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 18px; }
    main { max-width: 960px; margin: 0 auto; padding: 32px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; margin-bottom: 16px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 13px; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
      font-weight: 600; border: 1px solid var(--border);
    }
    .badge.completed { color: var(--accent); border-color: var(--accent); }
    .badge.running { color: var(--warn); border-color: var(--warn); }
    .badge.failed { color: var(--bad); border-color: var(--bad); }
    .badge.completed_empty { color: var(--muted); }
    button, .btn {
      background: var(--accent); color: #0b0c10; border: none; border-radius: 8px;
      padding: 10px 18px; font-weight: 700; cursor: pointer; font-size: 14px;
      text-decoration: none; display: inline-block;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    a.link { color: var(--accent); text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
    .markdown h1, .markdown h2, .markdown h3 { color: var(--text); }
    .markdown { color: #d5d8de; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('dashboard') }}">🧠 AI Breakthrough Discovery</a>
    <span class="muted">Groq + Tavily agentic pipeline</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
